[package]
name = "workbook-constellation"
version = "0.1.5"
description = "Read-only XLSX formula dependency map"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "workbook_constellation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.8.5", features = [] }
tauri-plugin-dialog = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
