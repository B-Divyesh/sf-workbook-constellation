name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || '' }}
      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Verify tag, commit, and package version
        run: node scripts/verify-release.mjs
      - name: Run unit tests
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run test:unit
      - name: Exercise Windows installer checksum handling
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: ./tests/windows-installer-check.ps1
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Workbook Constellation ${{ env.RELEASE_TAG }}'
          releaseBody: 'Unsigned desktop builds. Verify each download against SHA256SUMS.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify tag, commit, and package version
        run: node scripts/verify-release.mjs
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          gh release download "${RELEASE_TAG}" --dir release-assets
      - name: Write checksums and latest manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name 'latest.json' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '{version:.tag_name, assets:[.assets[]|{name:.name,url:.browser_download_url}]}' > latest.json
          gh release upload "${RELEASE_TAG}" SHA256SUMS latest.json --clobber

  verify-published-release:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: candidate
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify candidate provenance, every installer checksum, and CORS-safe metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: node scripts/verify-published-release.mjs
